<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QA Test Steps</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>

  <!-- ─── Header & toolbar ─────────────────────────────────────────────────── -->
  <header class="header">
    <div class="header-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
      </svg>
      <span class="title-text" id="test-title-text">QA Test Steps</span>
      <button class="btn-edit-title" id="btn-edit-title" title="Test adını düzenle" type="button">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <span class="step-count-badge" id="step-count-badge">0</span>
    </div>

    <div class="header-status" id="status-text">"Al" veya Cmd+Shift+S (tam ekran) · Cmd+Shift+X (alan seç)</div>

    <div class="toolbar">
      <button class="btn btn-capture" id="btn-capture" title="Tam ekran (Cmd+Shift+S) veya alan seç (Cmd+Shift+X)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        Al
      </button>

      <button class="btn btn-finish" id="btn-finish" title="Rapor indir">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        İndir
      </button>

      <button class="btn btn-clear" id="btn-clear" title="Tüm adımları temizle">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
        Temizle
      </button>
    </div>
  </header>

  <!-- ─── Step list ─────────────────────────────────────────────────────────── -->
  <div class="steps-wrapper" id="steps-wrapper">
    <div class="empty-state" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
      </svg>
      <p>Henüz adım yok.<br/>"Al", Cmd+Shift+S veya Cmd+Shift+X kullanın.</p>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
